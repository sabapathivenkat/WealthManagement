spring:
  application:
    name: wealth-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wealthdb?currentSchema=wealth}
    username: ${SPRING_DATASOURCE_USERNAME:wealth_app}
    password: ${SPRING_DATASOURCE_PASSWORD:wealth_app_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: wealth
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: wealth
    default-schema: wealth

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min-xxxxxxxxxx}
    expiration-ms: 86400000
  # Comma-separated list of allowed frontend origins for CORS. Defaults cover local dev;
  # in production, set CORS_ALLOWED_ORIGINS to your deployed frontend's exact origin(s),
  # e.g. https://your-app.vercel.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
