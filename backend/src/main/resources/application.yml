spring:
  application:
    name: wealth-management
  datasource:
    url: jdbc:postgresql://localhost:5433/wealthdb?currentSchema=wealth
    username: wealth_app
    password: wealth_app_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: wealth
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: wealth
    default-schema: wealth

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min-xxxxxxxxxx}
    expiration-ms: 86400000
